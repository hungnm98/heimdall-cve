# Heimdall example config. YAML or JSON both work (same keys).
# Secrets are never inlined: reference an env var (*_env) or a file (*_file).
# Scalar keys with a value or default can be overridden with HEIMDALL_<KEY>, e.g. HEIMDALL_CACHE_TTL.

# Named credentials. Each target picks one with `auth` (and optionally `list_auth`).
auth_profiles:
  gh-app:
    type: app                          # GitHub App: installation auto-discovered per owner
    app_id_env: HEIMDALL_GH_APP_ID
    private_key_file: /secrets/gh-app.pem
  gh-pat:
    type: token                        # classic / fine-grained PAT or GITHUB_TOKEN
    token_env: GITHUB_TOKEN
  gh-ssh:
    type: ssh                          # git over SSH (ssh-agent used when key_file is empty)
    key_file: ~/.ssh/id_ed25519
    known_hosts: ~/.ssh/known_hosts

# What to scan. kind: org | user | repo. provider defaults to github.
targets:
  - kind: org
    name: acme
    auth: gh-app
    branches: ["release/*", develop]   # scanned besides the default branch (names or globs)
    max_branches: 10                   # cap on extra branches per repo (default 10)
    schedule: "@daily"                 # full scan (cron, UTC; "@every 72h" = every 3 days); needs `serve`/`worker`
    poll: "@every 1h"                  # cheap check: rescan only branches whose commit moved
    filters:
      include: ["*"]
      exclude: ["sandbox-*", "*-archive"]
      skip_archived: true              # default true
      skip_forks: true                 # default true
  - kind: user
    name: some-dev
    auth: gh-pat
  - kind: repo
    url: git@github.com:acme/payments.git
    auth: gh-ssh
    branch: develop                    # default: the repo's default branch
  - kind: org                          # SSH cannot list repos: use list_auth or a static list
    name: acme-internal
    auth: gh-ssh
    list_auth: gh-pat
  # GitHub Enterprise Server:
  # - { kind: org, name: team, base_url: https://ghe.example.com/api/v3, auth: gh-pat }

# Ecosystems to scan. Empty (default) = every one compiled in: go, npm, rubygems.
# A repo with Go, Node.js and Ruby projects is scanned for all of them in one pass.
# ecosystems: [go, npm, rubygems]
# Never sent to public sources (glob: Go module paths, npm names/scopes, gem names).
private_modules: ["github.com/acme/*", "@acme/*", "acme-*"]
skip_paths: ["node_modules/", "vendor/", "testdata/", ".git/", "examples/"]

# Check sources. The key is the source name; `type` defaults to the key.
# Without a `sources` section, osv and endoflife are enabled.
sources:
  osv: { enabled: true }          # alias_severity: true fills GO-* severities from GHSA/CVE aliases
  endoflife: { enabled: true }
  nvd:                            # CVSS for findings still without severity (CVE aliases)
    api_key_env: NVD_API_KEY      # optional: 50 instead of 5 requests / 30 s
    max_lookups: 200              # uncached CVEs per run; the rest on the next runs
  kev: {}                         # CISA Known Exploited Vulnerabilities: priority 90–100 (catalog cached 24h)
  epss: {}                        # FIRST EPSS exploit probability (cached 24h per CVE)

# Notification channels. Several instances of one type may coexist.
notify:
  slack-sec:
    type: slack-webhook
    webhook_env: SLACK_WEBHOOK_URL

report:
  formats: [md, json]
  dir: reports

policy:
  sla_days: { CRITICAL: 7, HIGH: 30, MEDIUM: 90 }
  fail_on: HIGH                        # exit code 1 when an open finding is at least this severe
  eol_warning_days: 90
  suppressions_file: .heimdall-ignore.yaml

# Where scan history, findings and metadata live. Run `heimdall db migrate` once
# (and after upgrades); it is safe to run repeatedly and concurrently.
store:
  type: postgres
  dsn_env: HEIMDALL_PG_DSN             # e.g. postgres://heimdall:***@db:5432/heimdall?sslmode=require
  schema: heimdall
  max_conns: 10
  # Local runs without a database: { type: memory } (state is lost on exit)

cache:
  dir: ~/.cache/heimdall               # HTTP responses of sources
  ttl: 24h

# Repo content cache: git mirrors (SSH) and manifests by commit SHA (API).
# Unchanged repos are never cloned or downloaded again.
workspace:
  dir: ~/.cache/heimdall/repos
  prune_after: 720h                    # after scans (at most daily): delete mirrors unused for 30 days
                                       # and drop cached commits older than that (git gc)

# Background jobs. inline = in-process (CLI, no Valkey). asynq = Valkey-backed workers.
jobs:
  type: asynq
  addr_env: HEIMDALL_VALKEY_ADDR       # host:port
  password_env: HEIMDALL_VALKEY_PASSWORD
  concurrency: 4

# `heimdall serve`: web UI + REST API. No login: keep it on localhost or behind an SSO proxy.
server:
  listen: 127.0.0.1:8080
  # trusted_user_header: X-Forwarded-Email   # set by the SSO proxy, recorded in the audit log
  # public_url: https://heimdall.internal     # links from Slack messages to the UI

# Master key (base64, 32 bytes) that encrypts secrets entered in the web UI.
# Without it the UI cannot store secrets; env/file auth profiles still work.
secrets:
  master_key_env: HEIMDALL_MASTER_KEY

concurrency:
  repos: 8
  http_per_host: 4
